[project]
name = "ia-money"
version = "0.1.0"
description = "AI-powered expense tracking via Telegram"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.79.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "onnxruntime>=1.25,<1.26",
    "rapidocr-onnxruntime>=1.4.4",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]
